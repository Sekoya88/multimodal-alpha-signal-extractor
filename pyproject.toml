[project]
name = "alpha-signal-extractor"
version = "1.0.0"
description = "Multimodal Alpha-Signal Extractor — VLM + LLM trading signal generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Nicolas"},
]

dependencies = [
    # Data & Visualization
    "yfinance>=0.2.36",
    "mplfinance>=0.12.9b7",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "ta>=0.11.0",
    "plotly>=5.18.0",
    # LangChain Orchestration
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "llama-cpp-python>=0.3.10",
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tenacity>=8.2.0",
    # Streamlit
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "trl>=0.12.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.44.0",
    "peft>=0.13.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
alpha-signal = "alpha_signal.presentation.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
